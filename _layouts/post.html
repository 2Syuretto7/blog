---
layout: default
---
<article class="post" data-born="{{ page.date | date_to_xmlschema }}">
  <a class="up" href="{{ '/' | relative_url }}">Back to the surface</a>
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="meta"><span class="at"></span><time datetime="{{ page.date | date_to_xmlschema }}">written {{ page.date | date: "%-d %B %Y" }}</time></p>
  <div class="prose">
{{ content }}
  </div>
  <nav class="turn" aria-label="More writing">
    {% if page.next %}<a href="{{ page.next.url | relative_url }}"><small>shallower</small>{{ page.next.title }}</a>{% else %}<span></span>{% endif %}
    {% if page.previous %}<a class="deeper" href="{{ page.previous.url | relative_url }}"><small>deeper</small>{{ page.previous.title }}</a>{% endif %}
  </nav>
</article>
