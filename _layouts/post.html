---
layout: default
---
<header class="post-head">
  <a class="mast" href="{{ '/' | relative_url }}">blog</a>
  <h1 class="post-title">{{ page.title }}</h1>
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
</header>
<article class="prose">
{{ content }}
</article>
<nav class="turn" aria-label="More writing">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}"><small>before this</small>{{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
  {% if page.next %}<a class="later" href="{{ page.next.url | relative_url }}"><small>after this</small>{{ page.next.title }}</a>{% endif %}
</nav>
<div class="inkline" aria-hidden="true"><i></i></div>
