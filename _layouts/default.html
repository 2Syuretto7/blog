<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} / {% endif %}blog / arnav raja</title>
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 150 }}{% else %}{{ site.description }}{% endif %}">
<meta name="theme-color" content="#0b2140">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23bfe9ef'/%3E%3Cstop offset='.35' stop-color='%231b6080'/%3E%3Cstop offset='1' stop-color='%23020409'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' fill='url(%23g)'/%3E%3Ccircle cx='19' cy='24' r='2.4' fill='%237ff5d6'/%3E%3C/svg%3E">
<link rel="alternate" type="application/atom+xml" title="blog" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/abyss.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>document.documentElement.classList.add("js");</script>
</head>
<body class="{% if page.layout == 'post' %}is-post{% else %}is-home{% endif %}">
<canvas id="snow" aria-hidden="true"></canvas>
<div class="gauge" aria-hidden="true">
  <span class="zone" id="g-zone">Surface</span>
  <span class="depth"><b id="g-depth">0</b><small>m</small></span>
  <span class="sub" id="g-pressure">1 atm</span>
  <span class="sub" id="g-light">sunlight 100%</span>
</div>
<main class="page">
{{ content }}
</main>
<footer class="foot">
  <a href="https://arnavraja.in">arnavraja.in</a>
  <a href="https://stuff.arnavraja.in">stuff</a>
  <a href="{{ '/feed.xml' | relative_url }}">feed</a>
</footer>
<script src="{{ '/assets/abyss.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
