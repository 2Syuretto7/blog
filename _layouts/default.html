<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} / {% endif %}blog / arnav raja</title>
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 150 }}{% else %}{{ site.description }}{% endif %}">
<meta name="theme-color" content="#161616">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'%3E%3Crect width='32' height='32' fill='%23161616'/%3E%3Crect x='7' y='2' width='18' height='28' fill='%23fff'/%3E%3Crect x='9' y='6' width='8' height='3' fill='%23000'/%3E%3Cpath d='M10 12h12M10 15h12M10 18h9M10 21h12M10 24h7' stroke='%23000'/%3E%3C/svg%3E">
<link rel="alternate" type="application/atom+xml" title="blog" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/alto.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body data-key="alto-blog">
{{ content }}
<script src="{{ '/assets/alto.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
