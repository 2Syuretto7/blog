<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} / {% endif %}blog / arnav raja</title>
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 150 }}{% else %}{{ site.description }}{% endif %}">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='4' y='13' font-family='monospace' font-size='9' fill='%23e8ece6'%3E1%3C/text%3E%3Ctext x='10' y='22' font-family='monospace' font-size='9' fill='%23e8ece6'%3E1a%3C/text%3E%3Ctext x='10' y='30' font-family='monospace' font-size='9' fill='%237d847b'%3E1b%3C/text%3E%3C/svg%3E">
<link rel="alternate" type="application/atom+xml" title="blog" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/nls.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="lv1{% if page.layout == 'post' %} single{% endif %}">
{{ content }}
<script src="{{ '/assets/nls.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
