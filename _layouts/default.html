<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} / {% endif %}blog / arnav raja</title>
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 150 }}{% else %}{{ site.description }}{% endif %}">
<meta name="theme-color" content="#ece8f4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ece8f4'/%3E%3Ctext x='16' y='25' font-family='Georgia' font-weight='bold' font-size='26' text-anchor='middle' fill='%231c1530'%3Eb%3C/text%3E%3Crect x='4' y='14' width='24' height='4' fill='%23ece8f4'/%3E%3Ccircle cx='25' cy='7' r='2.6' fill='%23e2401b'/%3E%3C/svg%3E">
<link rel="alternate" type="application/atom+xml" title="blog" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/erosion.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="{% if page.layout == 'post' %}is-post{% else %}is-home{% endif %}">
<main class="page">
{{ content }}
</main>
<footer class="foot">
  <a href="https://arnavraja.in">arnavraja.in</a>
  <a href="https://stuff.arnavraja.in">stuff</a>
  <a href="{{ '/feed.xml' | relative_url }}">feed</a>
</footer>
<script src="{{ '/assets/erosion.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
